<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RAG-ассистент{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #1a6fb5;
      --accent-hover: #155c96;
      --border: #ccc;
      --muted: #667;
      --card-bg: #fff;
      --card-border: #e2e6ea;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
    }

    h1 { margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); margin-top: 0; }

    /* Карточка-контейнер для форм: одинаковые поля и отступы */
    .form-card {
      max-width: 480px;
      margin: 1.5rem auto 0;
      padding: 1.5rem 1.75rem 1.75rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    label {
      font-weight: 600;
      display: block;
      margin: 1rem 0 0.35rem;
    }

    label:first-child { margin-top: 0; }

    textarea,
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
    }

    textarea { resize: vertical; }

    textarea:focus,
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(26, 111, 181, 0.15);
    }

    button {
      margin-top: 1.25rem;
      padding: 0.55rem 1.4rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { background: var(--accent-hover); }

    button.linklike {
      margin-top: 0;
      padding: 0.15rem 0.5rem;
      background: none;
      color: var(--accent);
      font-weight: 600;
    }

    .form-card button { width: 100%; }

    .answer, .error, .notice {
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
    }

    .answer { background: #eef6ff; border: 1px solid #bcd9f5; }
    .error { background: #fff0f0; border: 1px solid #f0b9b9; color: #8a1f1f; }
    .notice { background: #f0fff4; border: 1px solid #b9e6c3; color: #1f6a34; }
    .answer h2 { margin-top: 0; }
    .answer pre { white-space: pre-wrap; font-family: inherit; margin: 0.25rem 0 0; }

    nav {
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--card-border);
      color: var(--muted);
    }

    nav a { color: var(--accent); text-decoration: none; }

    .form-footer {
      max-width: 480px;
      margin: 1rem auto 0;
      text-align: center;
      color: var(--muted);
    }

    .form-footer a { color: var(--accent); text-decoration: none; }

    @media (prefers-color-scheme: dark) {
      :root {
        --border: #555;
        --muted: #99a;
        --card-bg: #1e2229;
        --card-border: #333a44;
        --shadow: none;
      }
      .answer { background: #16283c; border-color: #2c4a6e; }
      .error { background: #3a1d1d; border-color: #6e2c2c; color: #f0b9b9; }
      .notice { background: #1d3a24; border-color: #2c6e3e; color: #b9e6c3; }
    }
  </style>
</head>
<body>
  {% block nav %}{% endblock %}

  {% block header %}
  <h1>{% block page_title %}RAG-ассистент{% endblock %}</h1>
  <p class="subtitle">{% block page_subtitle %}{% endblock %}</p>
  {% endblock %}

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
