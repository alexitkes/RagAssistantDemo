{% extends "base.html" %}

{% block title %}Регистрация — RAG-ассистент{% endblock %}

{% block page_title %}Регистрация{% endblock %}
{% block page_subtitle %}Зарегистрируйтесь, чтобы получить доступ к чату с ассистентом.{% endblock %}

{% block content %}
<form class="form-card" method="post">
  <label for="email">Электронная почта:</label>
  <input type="email" id="email" name="email" value="{{ email }}" required autofocus>

  <label for="display_name">Отображаемое имя:</label>
  <input type="text" id="display_name" name="display_name" value="{{ display_name }}" required>

  <label for="password">Пароль (не менее 8 символов):</label>
  <input type="password" id="password" name="password" required>

  <label for="password2">Подтверждение пароля:</label>
  <input type="password" id="password2" name="password2" required>

  <button type="submit">Зарегистрироваться</button>
</form>

<p class="form-footer">Уже зарегистрированы? <a href="{{ url_for('login') }}">Войти</a></p>
{% endblock %}
